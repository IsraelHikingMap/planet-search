name: Search relevance check

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Search API base to score against"
        required: true
        default: "https://mapeak.com"

jobs:
  relevance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Run relevance check
        env:
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          if ! printf '%s' "$ENDPOINT" | grep -Eq '^https?://[A-Za-z0-9._:/-]+$'; then
            echo "::error::endpoint must be a plain http(s) URL, got: $ENDPOINT"; exit 1
          fi
          mvn -q -Prelevance -Drelevance.endpoint="$ENDPOINT" test

      - name: Summarize relevance cases
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          annotate_only: true
          detailed_summary: true
